name: Fix Brand Pulse UI

on:
  push:
    branches: [agent/full-app-test-suite]
    paths: [.github/workflows/fix-brand-pulse-ui.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-app-test-suite
      - name: Patch Brand Pulse
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/components/brand-pulse-page.tsx');s=p.read_text()
          if '@/lib/brand-pulse-localization' not in s:
            s=s.replace("import {statusLabel} from '@/lib/i18n';", "import {statusLabel} from '@/lib/i18n';\nimport {brandPulseFieldLabel,brandPulseGroupLabel,brandPulseStatic,localizeBrandPulseAction} from '@/lib/brand-pulse-localization';",1)
          marker="if(error&&!data)return <section className=\"panel p-8\""
          pos=s.find(marker)
          if pos<0:raise SystemExit('error state marker missing')
          return_marker=" return <div className=\"space-y-6\">"
          if 'const recommended=' not in s:
            s=s.replace(return_marker," const recommended=localizeBrandPulseAction(locale,data?.recommended_action);\n"+return_marker,1)
          opening='<main className="space-y-6">'
          if opening in s:
            start=s.index(opening);close=s.find('</main>',start)
            s=s[:start]+s[start:].replace(opening,'<section className="space-y-6">',1)
            close=s.find('</main>',start);s=s[:close]+'</section>'+s[close+7:]
          s=s.replace('>Brand knowledge</h2>',">{brandPulseStatic(locale,'knowledge')}</h2>",1)
          s=s.replace('<h3 className="font-black">{title}</h3>','<h3 className="font-black">{brandPulseGroupLabel(locale,title)}</h3>',1)
          s=s.replace('<PulseField key={field} field={field} value={form[field]}','<PulseField key={field} locale={locale} field={field} value={form[field]}',1)
          s=s.replace('function PulseField({field,value,onChange}:any)','function PulseField({locale,field,value,onChange}:any)',1)
          s=s.replace('{field.replaceAll(\'_\',\' \')}<textarea','{brandPulseFieldLabel(locale,field)}<textarea',1)
          s=s.replace('<h2 className="text-xl font-black">Brand Pulse guide</h2>',"<h2 className=\"text-xl font-black\">{brandPulseStatic(locale,'guide')}</h2>",1)
          s=s.replace('{data?.recommended_action.description}','{recommended?.description}',1)
          s=s.replace("data?.recommended_action.action_href",'recommended?.action_href',1)
          s=s.replace("data?.recommended_action.action_label",'recommended?.action_label',1)
          s=s.replace('>Search collections<input','>{brandPulseStatic(locale,\'search\')}<input',1)
          s=s.replace('{items.length} item(s)','{items.length} {brandPulseStatic(locale,\'items\')}',1)
          p.write_text(s)

          p=Path('apps/web/e2e/app.spec.ts');s=p.read_text()
          analytics="  if(module==='analytics')await expect(page.locator('body')).not.toContainText(/Connect analytics|Publish first content|Group content into campaigns|No insights yet/);"
          pulse="  if(module==='brand-pulse')await expect(page.locator('body')).not.toContainText(/Brand knowledge|Brand basics|Voice and style|Offer and positioning|Rules and compliance|Brand Pulse guide|Search collections|item\\(s\\)/);"
          if pulse not in s:s=s.replace(analytics,analytics+'\n'+pulse,1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/brand-pulse-page.tsx apps/web/e2e/app.spec.ts
          git commit -m 'Fix Brand Pulse Persian UI and landmarks'
          git push origin HEAD:agent/full-app-test-suite
