name: Fix hidden localization

on:
  pull_request:
    paths: [.github/workflows/fix-hidden-localization.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch hidden localized surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/web/components/assets-library.tsx');s=p.read_text()
          marker='const formatBytes='
          extra="""const assetExtra:any={
 en:{retry:'Retry',studio:'Open Content Studio',titleField:'Title',descriptionField:'Description',tagsField:'Tags',altField:'Alt text',draftStatus:'Draft',approvedStatus:'Approved',typeLabels:{image:'Image',logo:'Logo',video:'Video',audio:'Audio',document:'Document',other:'Other'}},
 fa:{retry:'تلاش دوباره',studio:'باز کردن استودیوی محتوا',titleField:'عنوان',descriptionField:'توضیحات',tagsField:'برچسب‌ها',altField:'متن جایگزین تصویر',draftStatus:'پیش‌نویس',approvedStatus:'تأییدشده',typeLabels:{image:'تصویر',logo:'لوگو',video:'ویدئو',audio:'صدا',document:'سند',other:'سایر'}},
 de:{retry:'Erneut versuchen',studio:'Content Studio öffnen',titleField:'Titel',descriptionField:'Beschreibung',tagsField:'Tags',altField:'Alternativtext',draftStatus:'Entwurf',approvedStatus:'Freigegeben',typeLabels:{image:'Bild',logo:'Logo',video:'Video',audio:'Audio',document:'Dokument',other:'Andere'}}};
"""
          if 'const assetExtra:any=' not in s:s=s.replace(marker,extra+marker,1)
          s=s.replace("const c=copy[locale]||copy.en;","const c={...(copy[locale]||copy.en),...(assetExtra[locale]||assetExtra.en)};",1)
          replacements={
           '>Retry</button>':'>{c.retry}</button>',
           '>Open Content Studio</Link>':'>{c.studio}</Link>',
           'label="Title"':'label={c.titleField}',
           'label="Description"':'label={c.descriptionField}',
           'label="Tags"':'label={c.tagsField}',
           'label="Alt text"':'label={c.altField}',
           '<option value="draft">Draft</option>':'<option value="draft">{c.draftStatus}</option>',
           '<option value="approved">Approved</option>':'<option value="approved">{c.approvedStatus}</option>',
           "{['image','logo','video','audio','document','other'].map(value=><option value={value} key={value}>{value}</option>)}":"{['image','logo','video','audio','document','other'].map(value=><option value={value} key={value}>{c.typeLabels[value]||value}</option>)}",
           "{['draft','approved','rejected','archived'].map(value=><option value={value} key={value}>{value}</option>)}":"{['draft','approved','rejected','archived'].map(value=><option value={value} key={value}>{statusLabel(locale,value)}</option>)}",
          }
          for old,new in replacements.items():s=s.replace(old,new)
          p.write_text(s)

          p=Path('apps/web/components/settings-panel.tsx');s=p.read_text()
          marker='export function SettingsPanel'
          extra="""const settingsExtra:any={
 en:{loading:'Loading settings…',retry:'Retry',billing:'Billing',plan:'Plan',notConnected:'Not connected',invitedUser:'Invited user',completion:'Completion',provider:'Provider',model:'Model',temporaryKey:'Temporary API key',runtime:'Runtime status',aiOperations:'AI operations',draftCount:'Drafts',reportCount:'Reports',assetCount:'Assets'},
 fa:{loading:'در حال بارگذاری تنظیمات…',retry:'تلاش دوباره',billing:'صورتحساب',plan:'پلن',notConnected:'متصل نیست',invitedUser:'کاربر دعوت‌شده',completion:'میزان تکمیل',provider:'ارائه‌دهنده',model:'مدل',temporaryKey:'کلید موقت API',runtime:'وضعیت اجرا',aiOperations:'عملیات هوش مصنوعی',draftCount:'پیش‌نویس‌ها',reportCount:'گزارش‌ها',assetCount:'دارایی‌ها'},
 de:{loading:'Einstellungen werden geladen…',retry:'Erneut versuchen',billing:'Abrechnung',plan:'Tarif',notConnected:'Nicht verbunden',invitedUser:'Eingeladener Benutzer',completion:'Fortschritt',provider:'Provider',model:'Modell',temporaryKey:'Temporärer API-Schlüssel',runtime:'Laufzeitstatus',aiOperations:'KI-Vorgänge',draftCount:'Entwürfe',reportCount:'Berichte',assetCount:'Assets'}};
"""
          if 'const settingsExtra:any=' not in s:s=s.replace(marker,extra+marker,1)
          s=s.replace("const c=words[locale]||words.en;","const c={...(words[locale]||words.en),...(settingsExtra[locale]||settingsExtra.en)};",1)
          replacements={
           "error||'Loading settings…'":"error||c.loading",
           '>Retry</button>':'>{c.retry}</button>',
           'label="Billing"':'label={c.billing}',
           "value={data.organization?.billing_status||'Not connected'}":"value={data.organization?.billing_status||c.notConnected}",
           'label="Plan"':'label={c.plan}',
           "value={data.organization?.plan||'Not connected'}":"value={data.organization?.plan||c.notConnected}",
           "member.name||'Invited user'":"member.name||c.invitedUser",
           'label="Completion"':'label={c.completion}',
           'label="Provider"':'label={c.provider}',
           'label="Model"':'label={c.model}',
           'label="Temporary API key"':'label={c.temporaryKey}',
           'label="Runtime status"':'label={c.runtime}',
           'label="AI operations"':'label={c.aiOperations}',
           'label="Drafts"':'label={c.draftCount}',
           'label="Reports"':'label={c.reportCount}',
           'label="Assets"':'label={c.assetCount}',
          }
          for old,new in replacements.items():s=s.replace(old,new)
          p.write_text(s)

          p=Path('apps/web/e2e/app.spec.ts');s=p.read_text()
          anchor="  if(module==='integrations')await expect(page.locator('body')).not.toContainText(/Share authenticated or tokenized approval links|Send approvals and assisted publishing messages|Send approval requests to Bale|Assisted local publishing|No publishing connector connected|No analytics connector connected| · Easy| · Medium| · Hard/);"
          checks="""  if(module==='assets'){
   await expect(page.locator('body')).not.toContainText(/Open Content Studio|Retry/);
   await page.getByRole('button',{name:'بارگذاری دارایی'}).click();
   await expect(page.getByText('عنوان',{exact:true})).toBeVisible();
   await expect(page.getByText('توضیحات',{exact:true})).toBeVisible();
   await expect(page.getByText('متن جایگزین تصویر',{exact:true})).toBeVisible();
   await page.getByRole('button',{name:'×'}).click();
  }
  if(module==='settings'){
   for(const tab of ['سازمان','تیم و نقش‌ها','چک‌لیست راه‌اندازی','ارائه‌دهنده AI','مصرف']){
    await page.getByRole('button',{name:tab}).click();
    await expect(page.locator('main.app-content')).not.toContainText(/Billing|Not connected|Invited user|Completion|Temporary API key|Runtime status|AI operations/);
   }
  }
  if(module==='help')await expect(page.locator('main.app-content')).not.toContainText(/Getting started|How to operate this step|Read the purpose|Related actions/);"""
          if checks not in s:s=s.replace(anchor,anchor+'\n'+checks,1)
          p.write_text(s)
          PY
      - name: Verify TypeScript before commit
        working-directory: apps/web
        run: npm install && npm run lint
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/assets-library.tsx apps/web/components/settings-panel.tsx apps/web/e2e/app.spec.ts
          git commit -m 'Localize hidden asset and settings surfaces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
