name: Apply workspace route normalization

on:
  push:
    branches: [agent/fix-localization-mobile-ui]
    paths: [.github/workflows/apply-workspace-href-fixes.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-localization-mobile-ui
      - name: Normalize Brand Pulse routes
        run: |
          python - <<'PY'
          from pathlib import Path

          for root in [Path('apps/api'),Path('apps/web')]:
            for path in root.rglob('*'):
              if path.is_file() and path.suffix in {'.py','.ts','.tsx','.js','.mjs'}:
                text=path.read_text()
                changed=text.replace("/app/brand-dna","/app/brand-pulse")
                if changed!=text:path.write_text(changed)

          shell=Path('apps/web/components/app-shell.tsx')
          text=shell.read_text()
          marker="import {localizeHomeOverview,productCopy} from '@/lib/product-copy';"
          if "normalizeWorkspaceHref" not in text:
            text=text.replace(marker,marker+"\nimport {normalizeWorkspaceHref} from '@/lib/workspace-localization';",1)
          text=text.replace("const withLocale=(locale:string,href?:string)=>href?.startsWith(`/${locale}`)?href:`/${locale}${href||'/app/dashboard'}`;","const withLocale=(locale:string,href?:string)=>{const normalized=normalizeWorkspaceHref(href);return normalized.startsWith(`/${locale}`)?normalized:`/${locale}${normalized}`};",1)
          shell.write_text(text)

          dashboard=Path('apps/web/components/dashboard/dashboard-cockpit.tsx')
          text=dashboard.read_text()
          marker="import {statusLabel} from '@/lib/i18n';"
          if "normalizeWorkspaceHref" not in text:
            text=text.replace(marker,marker+"\nimport {normalizeWorkspaceHref} from '@/lib/workspace-localization';",1)
          text=text.replace("const href=(locale:string,value?:string)=>`/${locale}${value||'/app/dashboard'}`;","const href=(locale:string,value?:string)=>`/${locale}${normalizeWorkspaceHref(value)}`;",1)
          dashboard.write_text(text)
          PY
      - name: Commit route normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api apps/web
          git commit -m 'Normalize Brand Pulse routes across the workspace'
          git push origin HEAD:agent/fix-localization-mobile-ui
