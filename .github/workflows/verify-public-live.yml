name: Verify Smarbiz Public Live

on:
  push:
    branches: [ops/recover-production-20260726]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check public DNS and HTTPS
        id: public
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '=== DNS A ==='
            getent ahostsv4 smarbiz.sbs || true
            echo '=== DNS AAAA ==='
            getent ahostsv6 smarbiz.sbs || true
            echo '=== ROOT ==='
            curl -sSIL --max-time 20 https://smarbiz.sbs/ | sed -n '1,25p'
            echo '=== FA ==='
            curl -sSIL --max-time 20 https://smarbiz.sbs/fa | sed -n '1,25p'
            echo '=== HEALTHZ ==='
            curl -fsS --max-time 20 https://smarbiz.sbs/healthz
            echo
            echo '=== API ==='
            curl -fsS --max-time 20 https://smarbiz.sbs/api/health
            echo
          } 2>&1 | tee /tmp/public-live.log
          grep -q '^ok$' <(curl -fsS --max-time 20 https://smarbiz.sbs/healthz)
          curl -fsS --max-time 20 https://smarbiz.sbs/api/health | grep -q '"ok"[[:space:]]*:[[:space:]]*true'
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://smarbiz.sbs/fa)" = '200'

      - name: Publish public verification
        if: always()
        uses: actions/github-script@v7
        env:
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
        with:
          script: |
            const fs=require('fs');
            const title='[Ops] Smarbiz public availability';
            let log='';try{log=fs.readFileSync('/tmp/public-live.log','utf8')}catch(_){}
            const ok=process.env.PUBLIC_OUTCOME==='success';
            const body=[`## ${ok?'✅ Publicly available':'❌ Public path failing'}`,'',`- Outcome: **${process.env.PUBLIC_OUTCOME}**`,`- Checked at: ${new Date().toISOString()}`,'','```text',log.replace(/```/g,"'''"),'```'].join('\n');
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            const existing=issues.find(issue=>issue.title===title&&!issue.pull_request);
            if(existing)await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'open',body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});

      - name: Fail when public verification fails
        if: steps.public.outcome != 'success'
        run: exit 1
