name: Fix Integrations UI

on:
  push:
    branches: [agent/full-app-test-suite]
    paths: [.github/workflows/fix-integrations-ui.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-app-test-suite
      - name: Finish integrations localization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/components/integrations-page.tsx');s=p.read_text()
          s=s.replace('connectorCategoryLabel,connectorDifficultyLabel,localizeConnectorItem,localizeConnectorNotice','connectorCategoryLabel,connectorDifficultyLabel,connectorFieldLabel,localizeConnectorItem,localizeConnectorNotice',1)
          old="function choose(item:CatalogItem,list=connections){const existing=list.find(entry=>entry.id===item.connection_id)||null;setSelected(item);setConnection(existing);setConfig({display_name:existing?.display_name||item.label})}"
          new="function choose(item:CatalogItem,list=connections){const localized=localizeConnectorItem(locale,item) as CatalogItem;const existing=list.find(entry=>entry.id===item.connection_id)||null;setSelected(localized);setConnection(existing);setConfig({display_name:existing?.display_name||item.label})}"
          if old in s:s=s.replace(old,new,1)
          elif 'const localized=localizeConnectorItem' not in s:raise SystemExit('choose marker missing')
          s=s.replace('<Field label="Connection name"','<Field label={connectorFieldLabel(locale,\'Connection name\')}',1)
          s=s.replace("label={`${field.label}${field.required?' *':''}`}","label={`${connectorFieldLabel(locale,field.label)}${field.required?' *':''}`}",1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/integrations-page.tsx
          git commit -m 'Finish integrations drawer localization'
          git push origin HEAD:agent/full-app-test-suite
