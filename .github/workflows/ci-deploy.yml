name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: smarbiz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CONNECTOR_SECRET_KEY: ci-only-connector-secret-with-more-than-thirty-two-characters
      AUTH_RATE_LIMIT_PER_MINUTE: 1000
      NEXT_PUBLIC_API_URL: /api
      DEMO_MODE: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Run API tests
        working-directory: apps/api
        run: |
          set +e
          pytest -q --tb=short > pytest.log 2>&1
          STATUS=$?
          cat pytest.log
          exit $STATUS

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: apps/api/pytest.log
          if-no-files-found: ignore

      - name: PostgreSQL migration smoke test
        working-directory: apps/api
        run: |
          set -euo pipefail
          NAME=smarbiz-ci-postgres
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          docker run -d \
            --name "$NAME" \
            -e POSTGRES_DB=smarbiz_ci \
            -e POSTGRES_USER=smarbiz \
            -e POSTGRES_PASSWORD=smarbiz-ci-password \
            -p 127.0.0.1:55432:5432 \
            pgvector/pgvector:pg16 >/dev/null
          cleanup() {
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              echo "PostgreSQL migration smoke test failed. Database logs:"
              docker logs "$NAME" || true
            fi
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            exit "$STATUS"
          }
          trap cleanup EXIT
          for _ in $(seq 1 40); do
            if docker exec "$NAME" pg_isready -U smarbiz -d smarbiz_ci >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$NAME" pg_isready -U smarbiz -d smarbiz_ci
          DATABASE_URL='postgresql+psycopg://smarbiz:smarbiz-ci-password@127.0.0.1:55432/smarbiz_ci' alembic upgrade head
          CURRENT=$(DATABASE_URL='postgresql+psycopg://smarbiz:smarbiz-ci-password@127.0.0.1:55432/smarbiz_ci' alembic current)
          echo "$CURRENT"
          echo "$CURRENT" | grep -q '(head)'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install

      - name: Type-check web
        working-directory: apps/web
        run: npm run lint

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Prepare production environment for CI
        run: cp .env.production.example .env.production

      - name: Validate production Compose
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Build production containers
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Package release
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='*.db' -czf /tmp/smarbiz-release.tar.gz .

      - name: Check server SSH reachability
        id: preflight
        run: timeout 12 bash -c '</dev/tcp/91.107.157.75/22'

      - name: Upload release
        id: upload
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          test -n "$SSHPASS" || (echo "GitHub secret PASS is missing" && exit 1)
          sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/smarbiz-release.tar.gz root@91.107.157.75:/tmp/smarbiz-release.tar.gz

      - name: Deploy and verify
        id: remote_deploy
        env:
          SSHPASS: ${{ secrets.PASS }}
          RELEASE_SHA: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          OPENAI_API_KEY_B64="$(printf '%s' "$OPENAI_API_KEY" | base64 -w0)"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@91.107.157.75 "RELEASE_SHA='$RELEASE_SHA' OPENAI_API_KEY_B64='$OPENAI_API_KEY_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ca-certificates curl openssl
            curl -fsSL https://get.docker.com | sh
          fi
          if ! docker compose version >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker-compose-plugin
          fi
          if ! command -v curl >/dev/null 2>&1 || ! command -v ufw >/dev/null 2>&1 || ! command -v nginx >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl ufw nginx
          fi

          ufw allow 22/tcp
          ufw allow 80/tcp
          ufw allow 443/tcp
          ufw --force enable
          ufw reload

          BASE=/opt/smarbiz
          RELEASE="$BASE/releases/$RELEASE_SHA"
          SHARED="$BASE/shared"
          mkdir -p "$RELEASE" "$SHARED"
          rm -rf "$RELEASE"/*
          tar -xzf /tmp/smarbiz-release.tar.gz -C "$RELEASE"
          rm -f /tmp/smarbiz-release.tar.gz

          if [ ! -f "$SHARED/.env.production" ]; then
            umask 077
            POSTGRES_PASSWORD="$(openssl rand -hex 24)"
            JWT_SECRET="$(openssl rand -hex 48)"
            CONNECTOR_SECRET_KEY="$(openssl rand -hex 48)"
            cat > "$SHARED/.env.production" <<ENV
          APP_ENV=staging
          DEMO_MODE=false
          ALLOW_MOCK_CONNECTORS=false
          ALLOW_UNSAFE_DEV_DEFAULTS=false
          REQUIRE_MIGRATIONS=true
          RUN_MIGRATIONS=true
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql+psycopg://smarbiz:$POSTGRES_PASSWORD@postgres:5432/smarbiz
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET=$JWT_SECRET
          JWT_EXPIRES_MINUTES=10080
          JWT_ISSUER=smarbiz-api
          CONNECTOR_SECRET_KEY=$CONNECTOR_SECRET_KEY
          BOOTSTRAP_SUPERADMIN_EMAIL=
          AUTH_RATE_LIMIT_PER_MINUTE=12
          AI_PROVIDER=mock
          OPENAI_API_KEY=
          OPENAI_MODEL=gpt-5.6-sol
          OPENAI_REASONING_EFFORT=high
          OPENAI_TIMEOUT_SECONDS=90
          OPENAI_MAX_OUTPUT_TOKENS=6000
          ANTHROPIC_API_KEY=
          GEMINI_API_KEY=
          CORS_ORIGINS=https://smarbiz.sbs,https://www.smarbiz.sbs
          NEXT_PUBLIC_API_URL=/api
          TELEGRAM_BOT_TOKEN=
          BALE_BOT_TOKEN=
          BALE_BASE_URL=https://tapi.bale.ai/bot{token}/{method}
          BALE_SAFIR_BASE_URL=
          BALE_SAFIR_API_ACCESS_KEY=
          BALE_SAFIR_BOT_ID=
          S3_ENDPOINT=
          S3_BUCKET=smarbiz-assets
          ENV
          fi

          if [ -n "${OPENAI_API_KEY_B64:-}" ]; then
            export SMARBIZ_OPENAI_KEY="$(printf '%s' "$OPENAI_API_KEY_B64" | base64 -d)"
            python3 - "$SHARED/.env.production" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          updates = {
              "AI_PROVIDER": "openai",
              "OPENAI_API_KEY": os.environ["SMARBIZ_OPENAI_KEY"],
              "OPENAI_MODEL": "gpt-5.6-sol",
              "OPENAI_REASONING_EFFORT": "high",
              "OPENAI_TIMEOUT_SECONDS": "90",
              "OPENAI_MAX_OUTPUT_TOKENS": "6000",
          }
          with open(path, "r", encoding="utf-8") as handle:
              lines = handle.read().splitlines()
          seen = set()
          output = []
          for line in lines:
              key = line.split("=", 1)[0] if "=" in line else None
              if key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")
          with open(path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(output) + "\n")
          PY
            unset SMARBIZ_OPENAI_KEY
            echo "Production AI provider configured from GitHub secret."
          else
            echo "OPENAI_API_KEY GitHub secret is missing; AI calendar generation will stay unavailable until it is added."
          fi

          ln -sfn "$SHARED/.env.production" "$RELEASE/.env.production"
          PREVIOUS_CURRENT="$(readlink -f "$BASE/current" 2>/dev/null || true)"
          ln -sfn "$RELEASE" "$BASE/current"
          cd "$BASE/current"

          health_ready() {
            curl --fail --silent --show-error --max-time 4 http://127.0.0.1:18000/health >/dev/null 2>&1 \
              && curl --fail --silent --show-error --max-time 4 http://127.0.0.1:13000/en >/dev/null 2>&1
          }

          rollback_last_good() {
            LAST_GOOD="$(readlink -f "$BASE/last-good" 2>/dev/null || true)"
            CURRENT_RELEASE="$(readlink -f "$BASE/current" 2>/dev/null || true)"
            if [ -z "$LAST_GOOD" ] || [ ! -d "$LAST_GOOD" ] || [ "$LAST_GOOD" = "$CURRENT_RELEASE" ]; then
              echo "No distinct last-known-good release is available for rollback."
              return 1
            fi

            DB_REV="$(cd "$CURRENT_RELEASE" 2>/dev/null && docker compose --env-file .env.production -f docker-compose.prod.yml run --rm --no-deps --entrypoint alembic api current 2>/dev/null | sed -n 's/^\([0-9A-Za-z_-][0-9A-Za-z_-]*\).*/\1/p' | head -n1 || true)"
            if [ -z "$DB_REV" ] || ! grep -Rqs "revision = [\"']$DB_REV[\"']" "$LAST_GOOD/apps/api/alembic/versions"; then
              echo "Rollback skipped: database revision '${DB_REV:-unknown}' is not proven compatible with last-known-good code."
              return 1
            fi

            echo "Rolling production back to last-known-good release $LAST_GOOD (database revision $DB_REV)."
            ln -sfn "$LAST_GOOD" "$BASE/current"
            cd "$BASE/current"
            if ! docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans; then
              echo "Rollback compose startup failed."
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color --tail=220 api web postgres || true
              return 1
            fi
            for _ in $(seq 1 30); do
              if health_ready; then
                echo "Rollback restored healthy API and web services."
                return 0
              fi
              sleep 4
            done
            echo "Rollback release did not become healthy."
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color --tail=220 api web postgres || true
            return 1
          }

          if ! docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans; then
            echo "New release failed during Compose startup. Capturing diagnostics before exiting."
            docker compose --env-file .env.production -f docker-compose.prod.yml ps -a || true
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color --tail=260 api web postgres redis || true
            rollback_last_good || true
            exit 1
          fi

          API_READY=0
          WEB_READY=0
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:18000/health >/dev/null 2>&1; then
              API_READY=1
            fi
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:13000/en >/dev/null 2>&1; then
              WEB_READY=1
            fi
            if [ "$API_READY" = "1" ] && [ "$WEB_READY" = "1" ]; then
              break
            fi
            sleep 4
          done

          if [ "$API_READY" != "1" ] || [ "$WEB_READY" != "1" ]; then
            echo "Loopback API or web service did not become healthy."
            docker compose --env-file .env.production -f docker-compose.prod.yml ps -a || true
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color --tail=260 api web postgres redis || true
            rollback_last_good || true
            exit 1
          fi

          if [ -n "${OPENAI_API_KEY_B64:-}" ]; then
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api python - <<'PY'
          from app.services.ai.providers import get_ai_provider

          provider = get_ai_provider()
          assert provider.is_real, "Production AI provider did not initialize as real AI"
          assert provider.model == "gpt-5.6-sol", f"Unexpected production AI model: {provider.model}"
          schema = {
              "type": "object",
              "properties": {"ok": {"type": "boolean"}},
              "required": ["ok"],
              "additionalProperties": False,
          }
          result = provider.generate_json(
              "Production deployment smoke test. Return ok=true and nothing else.",
              schema=schema,
              language="en",
          )
          assert result.get("ok") is True, f"Unexpected OpenAI smoke-test output: {result}"
          print("Production AI live call passed:", provider.provider_name, provider.model)
          PY
          fi

          test -f /etc/letsencrypt/live/smarbiz.sbs/fullchain.pem
          test -f /etc/letsencrypt/live/smarbiz.sbs/privkey.pem

          NGINX_BACKUP="$SHARED/nginx-smarbiz-before-$RELEASE_SHA.conf"
          if [ -e /etc/nginx/sites-enabled/smarbiz ]; then
            cp -L /etc/nginx/sites-enabled/smarbiz "$NGINX_BACKUP"
          fi

          install -m 0644 infra/nginx/smarbiz.conf /etc/nginx/sites-available/smarbiz
          rm -f /etc/nginx/sites-enabled/smarbiz
          ln -s /etc/nginx/sites-available/smarbiz /etc/nginx/sites-enabled/smarbiz

          if ! nginx -t; then
            echo "New Nginx configuration is invalid; restoring the previous site."
            if [ -f "$NGINX_BACKUP" ]; then
              install -m 0644 "$NGINX_BACKUP" /etc/nginx/sites-available/smarbiz
              rm -f /etc/nginx/sites-enabled/smarbiz
              ln -s /etc/nginx/sites-available/smarbiz /etc/nginx/sites-enabled/smarbiz
              nginx -t
            fi
            exit 1
          fi

          systemctl enable nginx
          systemctl reload nginx

          curl --fail --silent --show-error --insecure --max-time 10 \
            --resolve smarbiz.sbs:443:127.0.0.1 \
            https://smarbiz.sbs/healthz | grep -q '^ok'

          curl --fail --silent --show-error --insecure --max-time 15 \
            --resolve smarbiz.sbs:443:127.0.0.1 \
            https://smarbiz.sbs/api/health | grep -q '"ok"[[:space:]]*:[[:space:]]*true'

          curl --fail --silent --show-error --insecure --max-time 15 \
            --resolve smarbiz.sbs:443:127.0.0.1 \
            https://smarbiz.sbs/en | grep -qi 'Smarbiz'

          # Only a release that passed containers, migrations, loopback health, Nginx,
          # TLS, API, and landing-page checks becomes the rollback target.
          ln -sfn "$RELEASE" "$BASE/last-good"
          echo "Recorded last-known-good release: $RELEASE"

          docker image prune -f

          CURRENT_PATH="$(readlink -f "$BASE/current" 2>/dev/null || true)"
          LAST_GOOD_PATH="$(readlink -f "$BASE/last-good" 2>/dev/null || true)"
          mapfile -t OLD_RELEASES < <(find "$BASE/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2-)
          for OLD in "${OLD_RELEASES[@]:-}"; do
            [ -n "$OLD" ] || continue
            if [ "$OLD" = "$CURRENT_PATH" ] || [ "$OLD" = "$LAST_GOOD_PATH" ]; then
              echo "Preserving protected release $OLD"
              continue
            fi
            rm -rf "$OLD"
          done

          ufw status verbose
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          echo "Previous current release was: ${PREVIOUS_CURRENT:-none}"
          REMOTE

      - name: Report production deployment
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_CONCLUSION: ${{ steps.preflight.conclusion }}
          UPLOAD_CONCLUSION: ${{ steps.upload.conclusion }}
          DEPLOY_CONCLUSION: ${{ steps.remote_deploy.conclusion }}
        with:
          script: |
            const title = '[Deploy] Smarbiz production status';
            const success = process.env.JOB_STATUS === 'success';
            const marker = success ? '✅ Successful' : '❌ Failed';
            const body = [
              `## ${marker}`,
              '',
              `- Commit: \`${context.sha}\``,
              `- SSH preflight: **${process.env.PREFLIGHT_CONCLUSION || 'not run'}**`,
              `- Release upload: **${process.env.UPLOAD_CONCLUSION || 'not run'}**`,
              `- Containers, PostgreSQL migrations, rollback guard, Nginx, and origin health: **${process.env.DEPLOY_CONCLUSION || 'not run'}**`,
              `- Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              success
                ? 'PostgreSQL migration gate, PostgreSQL, Redis, API, Web, Nginx, origin health, and last-known-good recording passed.'
                : 'The workflow now captures production logs before exit and attempts a database-compatible rollback to the last-known-good release.',
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
