name: Fix insights runtime and localization

on:
  push:
    branches: [agent/full-app-test-suite]
    paths: [.github/workflows/fix-insights-runtime.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-app-test-suite
      - name: Patch insights page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/components/insights-page.tsx')
          s=p.read_text()
          if "@/lib/insights-localization" not in s:
            s=s.replace("import {useToast} from './ui/toast';", "import {useToast} from './ui/toast';\nimport {localizeInsightItem} from '@/lib/insights-localization';",1)
          marker="const has=(data?.summary.content_with_data_count||0)>0;"
          if 'const recommendations=' not in s:
            s=s.replace(marker,marker+"\n const recommendations=(data?.recommendations||[]).map(item=>localizeInsightItem(locale,item) as Recommendation);\n const alerts=(data?.alerts||[]).map(item=>localizeInsightItem(locale,item) as any);",1)
          opening='<main className="space-y-5">'
          if opening in s:
            start=s.index(opening);close=s.find('</main>',start)
            s=s[:start]+s[start:].replace(opening,'<section className="space-y-5">',1)
            close=s.find('</main>',start);s=s[:close]+'</section>'+s[close+7:]
          s=s.replace('data?.recommendations.length?','recommendations.length?')
          s=s.replace('data.recommendations.map(item=>','recommendations.map(item=>')
          s=s.replace('data?.alerts.map(alert=>','alerts.map(alert=>')
          p.write_text(s)

          p=Path('apps/web/e2e/app.spec.ts');s=p.read_text()
          anchor="  await expect(page.locator('body')).not.toContainText(/Application error|Internal Server Error|خطای داخلی سرور/i);"
          check="  if(module==='analytics')await expect(page.locator('body')).not.toContainText(/Connect analytics|Publish first content|Group content into campaigns|No insights yet/);"
          if check not in s:s=s.replace(anchor,anchor+'\n'+check,1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/insights-page.tsx apps/web/e2e/app.spec.ts
          git commit -m 'Fix insights landmarks and Persian dynamic copy'
          git push origin HEAD:agent/full-app-test-suite
