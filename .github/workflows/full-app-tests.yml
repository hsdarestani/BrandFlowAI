name: Full App Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarbiz-full-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install web test dependencies
        working-directory: apps/web
        run: npm install

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          sed -i 's/^AUTH_RATE_LIMIT_PER_MINUTE=.*/AUTH_RATE_LIMIT_PER_MINUTE=1000/' .env
          sed -i 's/^DEMO_MODE=.*/DEMO_MODE=true/' .env
          sed -i 's/^NEXT_PUBLIC_API_URL=.*/NEXT_PUBLIC_API_URL=http:\/\/127.0.0.1:8000/' .env

      - name: Start the complete application stack
        run: docker compose up -d --build postgres redis api web

      - name: Wait for API and web readiness
        run: |
          set -euo pipefail
          API_READY=0
          WEB_READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8000/health >/dev/null; then API_READY=1; fi
            if curl --fail --silent --max-time 3 http://127.0.0.1:3000/fa/auth/login >/dev/null; then WEB_READY=1; fi
            if [ "$API_READY" = "1" ] && [ "$WEB_READY" = "1" ]; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=250 api web postgres redis
          exit 1

      - name: Check visible localization regressions
        working-directory: apps/web
        run: npm run check:i18n

      - name: Run full browser and tenant-isolation suite
        working-directory: apps/web
        env:
          E2E_WEB_URL: http://127.0.0.1:3000
          E2E_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-browser-results
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color --tail=400 api web worker scheduler postgres redis > full-app-services.log 2>&1 || true

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-service-logs
          path: full-app-services.log
          if-no-files-found: ignore

      - name: Stop isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
