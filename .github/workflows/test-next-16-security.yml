name: Test Next 16 Security Upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-next-16-security.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Next 16.3.2 without changing main source
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install next@16.3.2 --save-exact
          NEXT_VERSION=$(node -p "require('next/package.json').version")
          REACT_VERSION=$(node -p "require('react/package.json').version")
          REACT_DOM_VERSION=$(node -p "require('react-dom/package.json').version")
          echo "next=$NEXT_VERSION react=$REACT_VERSION react_dom=$REACT_DOM_VERSION"
          npm run lint
          npm run build
          npm audit --omit=dev --json > /tmp/audit.json || true
          NEXT_VERSION="$NEXT_VERSION" REACT_VERSION="$REACT_VERSION" REACT_DOM_VERSION="$REACT_DOM_VERSION" python3 - <<'PY'
          import json, os, pathlib
          data=json.load(open('/tmp/audit.json'))
          out={
            'build_ok': True,
            'next_version': os.environ['NEXT_VERSION'],
            'react_version': os.environ['REACT_VERSION'],
            'react_dom_version': os.environ['REACT_DOM_VERSION'],
            'runtime_vulnerabilities': data.get('metadata',{}).get('vulnerabilities',{}),
            'packages': [
              {'name':n,'severity':v.get('severity'),'range':v.get('range'),'fix_available':v.get('fixAvailable')}
              for n,v in data.get('vulnerabilities',{}).items()
            ],
          }
          p=pathlib.Path('../../status/smarbiz-next16-test.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist test result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/smarbiz-next16-test.json
          git diff --cached --quiet && exit 0
          git commit -m "record Smarbiz Next 16 security test"
          git push
