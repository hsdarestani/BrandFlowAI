name: Fix semantic landmarks

on:
  push:
    branches: [agent/full-app-test-suite]
    paths: [.github/workflows/fix-landmarks.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-app-test-suite
      - name: Replace nested main landmarks
        run: |
          python - <<'PY'
          from pathlib import Path

          targets={
            Path('apps/web/components/calendar/content-calendar.tsx'):'<main className="min-w-0 space-y-4">',
            Path('apps/web/components/reports-page.tsx'):'<main className="panel min-w-0 p-5 md:p-7">',
          }
          for path,opening in targets.items():
            text=path.read_text()
            if text.count(opening) != 1:
              raise SystemExit(f'{path}: expected one nested main opening')
            start=text.index(opening)
            close=text.find('</main>',start)
            if close < 0:
              raise SystemExit(f'{path}: nested main closing not found')
            text=text[:start]+text[start:].replace(opening,opening.replace('<main','<section'),1)
            close=text.find('</main>',start)
            text=text[:close]+'</section>'+text[close+7:]
            path.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/calendar/content-calendar.tsx apps/web/components/reports-page.tsx
          git commit -m 'Remove nested main landmarks'
          git push origin HEAD:agent/full-app-test-suite
