name: Fix semantic landmarks

on:
  push:
    branches: [agent/full-app-test-suite]
    paths: [.github/workflows/fix-landmarks.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-app-test-suite
      - name: Enforce one application main landmark
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/web/e2e/app.spec.ts')
          text=path.read_text()
          old="  await expect(page.locator('main')).toBeVisible();"
          new="  await expect(page.locator('main.app-content')).toBeVisible();\n  await expect(page.locator('main')).toHaveCount(1);"
          if old not in text:
            if new not in text:
              raise SystemExit('Expected main landmark assertion was not found')
          else:
            text=text.replace(old,new,1)
            path.write_text(text)
          PY
      - name: Commit test hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/app.spec.ts
          git diff --cached --quiet || git commit -m 'Enforce a single app main landmark'
          git push origin HEAD:agent/full-app-test-suite
