name: Fix mobile regressions

on:
  push:
    branches: [agent/full-app-test-suite]
    paths: [.github/workflows/fix-mobile-regressions.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-app-test-suite
      - name: Fix icon path and mobile language touch targets
        run: |
          python - <<'PY'
          from pathlib import Path

          shell=Path('apps/web/components/app-shell.tsx')
          text=shell.read_text()
          old="help:'M9.5 9a2.8 2.8 0 1 1 4.1 2.5c-1.2.6-1.6 1.2-1.6 2.5m0 4h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0-18Z'"
          new="help:'M9.5 9a2.8 2.8 0 1 1 4.1 2.5c-1.2.6-1.6 1.2-1.6 2.5m0 4h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0-18 0Z'"
          if old in text:text=text.replace(old,new,1)
          elif new not in text:raise SystemExit('help icon path marker missing')
          shell.write_text(text)

          css=Path('apps/web/app/globals.css')
          source=css.read_text()
          old_media='@media (max-width:767px){.activation-hero{border-radius:20px}.panel,.card,.command-card{border-radius:16px}.app-content{padding:1rem}.btn,.chip{min-height:42px}}'
          new_media='@media (max-width:767px){.activation-hero{border-radius:20px}.panel,.card,.command-card{border-radius:16px}.app-content{padding:1rem}.btn,.chip{min-height:42px}.language-option{min-width:40px;height:40px}.language-switcher{padding:2px}}'
          if old_media in source:source=source.replace(old_media,new_media,1)
          elif new_media not in source:raise SystemExit('mobile media marker missing')
          css.write_text(source)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/app-shell.tsx apps/web/app/globals.css
          git commit -m 'Fix mobile language targets and help icon'
          git push origin HEAD:agent/full-app-test-suite
# Trigger after workflow registration.
