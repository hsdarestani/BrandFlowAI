name: Audit Smarbiz Production Web Dependencies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smarbiz-web-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit runtime dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install >/dev/null
          npm audit --omit=dev --json > /tmp/audit.json || true
          python3 - <<'PY'
          import json, pathlib
          data=json.load(open('/tmp/audit.json'))
          meta=data.get('metadata', {}).get('vulnerabilities', {})
          vulns=data.get('vulnerabilities', {})
          out={
              'next_version': '15.5.21',
              'react_version': '19.1.2',
              'counts': meta,
              'packages': [
                  {
                      'name': name,
                      'severity': info.get('severity'),
                      'is_direct': info.get('isDirect'),
                      'range': info.get('range'),
                      'fix_available': info.get('fixAvailable'),
                  }
                  for name, info in vulns.items()
              ],
          }
          path=pathlib.Path('../../status/smarbiz-web-runtime-audit.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, indent=2, sort_keys=True)+'\n')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - name: Persist audit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/smarbiz-web-runtime-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "record Smarbiz runtime dependency audit"
          git push
