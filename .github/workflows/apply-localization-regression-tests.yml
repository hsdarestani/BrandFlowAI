name: Apply localization regression tests

on:
  push:
    branches: [agent/fix-localization-mobile-ui]
    paths: [.github/workflows/apply-localization-regression-tests.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-localization-mobile-ui
      - name: Add browser and source regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          spec=Path('apps/web/e2e/app.spec.ts')
          text=spec.read_text()
          marker="test('Persian content tools localize dynamic setup data and legacy routes'"
          if marker not in text:
            text += r'''

test('Persian content tools localize dynamic setup data and legacy routes',async({page,request})=>{
 const session=await createSession(request,'fa');
 await installSession(page,session.token);

 await page.goto('/fa/app/content-studio',{waitUntil:'domcontentloaded'});
 await expect(page.getByRole('heading',{name:'استودیوی محتوا'})).toBeVisible();
 await expect(page.getByText('ابتدا این مراحل را کامل کنید')).toBeVisible();
 const studioText=await page.locator('main.app-content').innerText();
 for(const stale of ['No product/service','Brand Pulse incomplete','No approval method','No channels selected','Compliance','Rewrite','Shorten','More formal','More direct','Translate…','Not saved','characters'])expect(studioText).not.toContain(stale);
 await expect(page.getByText('افزودن محصول یا خدمت',{exact:true})).toBeVisible();
 await expect(page.getByText('تکمیل پالس برند',{exact:true})).toBeVisible();
 await expect(page.getByText('اتصال روش تأیید',{exact:true})).toBeVisible();

 await page.goto('/fa/app/brand-dna?section=offers',{waitUntil:'domcontentloaded'});
 await expect(page).toHaveURL(/\/fa\/app\/brand-pulse\?section=offers/);
 await expect(page.getByRole('heading',{name:'پالس برند'})).toBeVisible();
 const pulseText=await page.locator('main.app-content').innerText();
 for(const stale of ['A living knowledge base','Complete Brand Pulse','Add product/service','Brand Pulse builder','Brand basics','Analyze website','Generate Brand Pulse','Cancel','Memory text','Preferred channels'])expect(pulseText).not.toContain(stale);

 await page.getByRole('button',{name:/افزودن/}).first().click();
 const dialog=page.getByRole('dialog');
 await expect(dialog).toBeVisible();
 await expect(dialog).toContainText('نام');
 await expect(dialog).toContainText('نوع');
 await expect(dialog).toContainText('انصراف');
 await expect(dialog).not.toContainText(/Cancel|Name|Type|Status|Description/);
 await dialog.getByRole('button',{name:'بستن'}).click();

 await page.getByRole('button',{name:'English'}).click();
 await expect(page).toHaveURL(/\/en\/app\/brand-pulse/);
 await expect(page.getByRole('heading',{name:'Brand Pulse'})).toBeVisible();
 await page.getByRole('button',{name:'Persian'}).click();
 await expect(page).toHaveURL(/\/fa\/app\/brand-pulse/);
 await expect(page.getByRole('heading',{name:'پالس برند'})).toBeVisible();
});
'''
            spec.write_text(text)

          check=Path('apps/web/scripts/check-visible-strings.mjs')
          source=check.read_text()
          old="'components/login-screen.tsx':['Brand-aware','Approval-ready','Measured'],\n};"
          new="'components/login-screen.tsx':['Brand-aware','Approval-ready','Measured'],\n 'app/[locale]/app/content-studio/page.tsx':['>Compliance<','>Rewrite<','>Shorten<','>More formal<','>More direct<','>Copy all<'],\n 'components/brand-pulse-page.tsx':['>Cancel<','>Analyze website<','>Generate Brand Pulse<'],\n};"
          if old in source:source=source.replace(old,new,1)
          check.write_text(source)
          PY
      - name: Commit regression coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/app.spec.ts apps/web/scripts/check-visible-strings.mjs
          git commit -m 'Cover dynamic Persian localization and legacy Brand Pulse routes'
          git push origin HEAD:agent/fix-localization-mobile-ui
# Trigger after workflow registration.
