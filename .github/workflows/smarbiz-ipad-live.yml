name: Verify Smarbiz iPad Fix Live

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/app/mobile-ios.css'
      - '.github/workflows/smarbiz-ipad-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Wait for this commit to reach production and verify compiled CSS
        env:
          PASS: ${{ secrets.PASS }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASS" || (echo 'PASS secret is missing' && exit 1)

          CURRENT=''
          for attempt in $(seq 1 80); do
            CURRENT=$(sshpass -p "$PASS" ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new root@91.107.157.75 \
              "basename \"\$(readlink -f /opt/smarbiz/current 2>/dev/null || true)\"" 2>/dev/null || true)
            echo "attempt=$attempt current=${CURRENT:-none} expected=$RELEASE_SHA"
            if [ "$CURRENT" = "$RELEASE_SHA" ]; then
              break
            fi
            sleep 15
          done
          test "$CURRENT" = "$RELEASE_SHA" || {
            echo "Production never switched to release $RELEASE_SHA"
            exit 1
          }

          sshpass -p "$PASS" ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new root@91.107.157.75 \
            "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(basename "$(readlink -f /opt/smarbiz/current)")" = "$RELEASE_SHA"
          grep -q '@media (max-width: 1180px)' /opt/smarbiz/current/apps/web/app/mobile-ios.css
          grep -q 'font-size: 16px' /opt/smarbiz/current/apps/web/app/mobile-ios.css

          HTML=$(curl --fail --silent --show-error --max-time 15 http://127.0.0.1:13000/de/onboarding)
          printf '%s' "$HTML" | grep -qi 'Smarbiz'
          mapfile -t CSS_PATHS < <(printf '%s' "$HTML" | grep -oE '/_next/static/css/[^"? ]+\.css' | sort -u)
          test "${#CSS_PATHS[@]}" -gt 0
          COMPILED=''
          for path in "${CSS_PATHS[@]}"; do
            COMPILED+="$(curl --fail --silent --show-error --max-time 15 "http://127.0.0.1:13000$path")"
          done
          MINIFIED=$(printf '%s' "$COMPILED" | tr -d '[:space:]')
          printf '%s' "$MINIFIED" | grep -q '@media(max-width:1180px)'
          printf '%s' "$MINIFIED" | grep -q 'font-size:16px'
          printf '%s' "$MINIFIED" | grep -q 'overflow-x:hidden'
          echo 'SMARBIZ_IPAD_FIX_LIVE=VERIFIED'
          REMOTE

      - name: Mark live verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d '{"state":"success","context":"smarbiz/ipad-live","description":"iPad onboarding fix is deployed and compiled"}' >/dev/null

      - name: Mark live verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d '{"state":"failure","context":"smarbiz/ipad-live","description":"iPad fix did not verify on production"}' >/dev/null || true
