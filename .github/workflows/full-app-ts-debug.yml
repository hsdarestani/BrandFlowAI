name: Full App TypeScript Diagnostics

on:
  push:
    branches: [agent/full-app-test-suite]
    paths: [.github/workflows/full-app-ts-debug.yml]

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-app-test-suite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix nullable integration catalog lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/web/components/integrations-page.tsx')
          text=path.read_text()
          old='const item=data.catalog.find(entry=>entry.provider===step.provider)'
          new='const item=data?.catalog.find(entry=>entry.provider===step.provider)'
          if old in text:text=text.replace(old,new,1)
          elif new not in text:raise SystemExit('integration catalog lookup marker missing')
          path.write_text(text)
          PY
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Capture TypeScript
        id: check
        continue-on-error: true
        working-directory: apps/web
        run: npm run lint > /tmp/full-app-ts.log 2>&1
      - name: Commit fix when type-safe
        if: steps.check.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/integrations-page.tsx
          git diff --cached --quiet || git commit -m 'Handle nullable integrations overview safely'
          git push origin HEAD:agent/full-app-test-suite
      - name: Publish diagnostics
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs=require('fs');
            const title='[Debug] Smarbiz full app TypeScript';
            let log='';try{log=fs.readFileSync('/tmp/full-app-ts.log','utf8')}catch(_){ }
            if(log.length>24000)log=log.slice(-24000);
            const body=`Commit: \`${context.sha}\`\n\nOutcome: **${process.env.OUTCOME}**\n\n\`\`\`text\n${log.replace(/```/g,"'''")}\n\`\`\``;
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            const existing=issues.find(issue=>issue.title===title&&!issue.pull_request);
            if(existing)await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'open',body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
      - name: Fail on TypeScript error
        if: steps.check.outcome != 'success'
        run: exit 1
