name: Fix Brand Pulse semantics

on:
  push:
    branches: [agent/fix-localization-mobile-ui]
    paths: [.github/workflows/fix-brand-pulse-semantics.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-localization-mobile-ui
      - name: Remove nested main landmark
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/web/components/brand-pulse-page.tsx')
          text=path.read_text()
          old='<main className="space-y-4">'
          close='</main>\n\n   <aside className="order-first space-y-4 xl:order-none xl:sticky xl:top-24 xl:h-fit">'
          if old not in text: raise SystemExit('inner main marker not found')
          if close not in text: raise SystemExit('inner main close marker not found')
          text=text.replace(old,'<section className="space-y-4">',1)
          text=text.replace(close,'</section>\n\n   <aside className="order-first space-y-4 xl:order-none xl:sticky xl:top-24 xl:h-fit">',1)
          path.write_text(text)
          PY
      - name: Commit semantic fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/components/brand-pulse-page.tsx
          git commit -m 'Remove nested main from Brand Pulse workspace'
          git push origin HEAD:agent/fix-localization-mobile-ui
# Trigger after workflow registration.
